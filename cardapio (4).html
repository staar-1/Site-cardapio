header{min-height:min(62vh,460px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 18px 30px}
.eyebrow{letter-spacing:.35em;text-transform:uppercase;font-size:.72rem;color:var(--gold);margin:0 0 10px}
header h1{margin:0;font:700 clamp(2.4rem,9vw,4.6rem)/1.05 var(--serif);text-shadow:0 4px 30px #000a}
header p.sub{margin:12px 0 26px;color:var(--mut);font-size:1.02rem;max-width:30em}
.orn{width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}
.search{width:100%;max-width:520px}
.search input{width:100%;padding:15px 22px;border-radius:99px;border:1px solid var(--line);font-size:1rem;background:rgba(255,255,255,.12);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);outline:0}
.search input::placeholder{color:var(--mut)}.search input:focus{border-color:var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(12,18,10,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-block:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
@media(min-width:900px){nav{justify-content:center}}
nav button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 18px;border-radius:99px;font:500 .9rem Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:.2s}
nav button:hover{border-color:var(--gold)}
nav button.on{background:var(--gold);color:#241a08;border-color:var(--gold)}
main{max-width:1120px;margin:auto;padding:0 16px}
section{padding-top:38px}
h2{margin:0 0 6px;font:700 clamp(1.7rem,5vw,2.3rem)/1.1 var(--serif);display:flex;align-items:center;gap:16px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h3{margin:20px 0 10px;font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:14px}
.it{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 18px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start;transition:border-color .25s,transform .25s}
.it:hover{transform:translateY(-3px);border-color:rgba(230,181,102,.5);box-shadow:0 10px 30px #0006}
.it b{display:block;font-weight:600;font-size:1.02rem}
.it small{color:var(--mut);display:block;margin-top:4px;font-size:.84rem;line-height:1.4}
.r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:74px}
.pr{font:700 1.08rem var(--serif);color:var(--gold)}
.add{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:1.4rem;cursor:pointer;line-height:1;transition:.2s}
.add:hover{background:var(--gold);color:#241a08}
.q{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.q button{width:30px;height:30px;border-radius:50%;border:0;background:var(--gold);color:#241a08;font-size:1.1rem;cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:.84rem;margin:6px 0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
#bar button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:auto;border:0;border-radius:99px;background:var(--gold);color:#241a08;font:700 1rem Inter,sans-serif;padding:16px 24px;cursor:pointer;box-shadow:0 8px 30px #000a}
#ov{position:fixed;inset:0;background:#000a;display:none;z-index:9;backdrop-filter:blur(4px)}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:#161e12;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));max-width:620px;margin:auto}
#sh h2::after{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font:700 1.3rem var(--serif);margin:16px 0;color:var(--gold)}
.act{width:100%;padding:15px;border-radius:99px;border:0;background:var(--gold);color:#241a08;font:700 1rem Inter,sans-serif;cursor:pointer;margin-top:8px}
.act.s{background:transparent;color:var(--ink);border:1px solid var(--line)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:40px 16px}
.add,.q,#bar,#ov{display:none!important}
body{padding-bottom:20px}

const $=id=>document.getElementById(id),fmt=v=>"R$ "+v.toFixed(2).replace(".",",");
const cart={};let q="";
function render(){
 const t=q.trim().toLowerCase();let h="";
 D.forEach(c=>{let s="";
  c.g.forEach(([gt,items])=>{
   const l=items.filter(i=>!t||(i[0]+" "+i[2]+" "+c.t).toLowerCase().includes(t));
   if(!l.length)return;
   s+=(gt?`<h3>${gt}</h3>`:"")+`<div class="grid">`+l.map(i=>{
    const n=i[0],k=n.replace(/'/g,"&#39;"),x=cart[n];
    let a=i[1]==null?`<span class="note">Consulte</span>`:x?`<div class="q"><button onclick="ch('${k}',-1)">−</button><b>${x.q}</b><button onclick="ch('${k}',1)">+</button></div>`:`<button class="add" aria-label="Adicionar" onclick="ch('${k}',1,${i[1]})">+</button>`;
    return `<div class="it"><div><b>${n}</b>${i[2]?`<small>${i[2]}</small>`:""}</div><div class="r">${i[1]!=null?`<span class="pr">${fmt(i[1])}</span>`:""}${a}</div></div>`}).join("")+`</div>`});
  if(s)h+=`<section id="${c.id}"><h2>${c.t}</h2>${s}</section>`});
 $("m").innerHTML=h||`<p class="note" style="padding:24px 0">Nada encontrado.</p>`;
 bar()}
function ch(n,d,p){if(!cart[n]){if(d<0)return;cart[n]={p,q:0}}cart[n].q+=d;if(cart[n].q<=0)delete cart[n];const y=scrollY;render();scrollTo(0,y);if($("ov").style.display==="block")openC()}
function bar(){const e=Object.values(cart),n=e.reduce((a,b)=>a+b.q,0),t=e.reduce((a,b)=>a+b.q*b.p,0);
 $("bar").style.display=n?"block":"none";$("bc").textContent=`🛒 Ver pedido (${n})`;$("bt").textContent=fmt(t)}
function openC(){const e=Object.entries(cart),t=e.reduce((a,[,b])=>a+b.q*b.p,0);
 $("sh").innerHTML=`<h2>Seu pedido</h2>`+(e.length?e.map(([n,b])=>{const k=n.replace(/'/g,"&#39;");return `<div class="row"><div><b>${n}</b><small class="note">${fmt(b.p)}</small></div><div class="q"><button onclick="ch('${k}',-1)">−</button><b>${b.q}</b><button onclick="ch('${k}',1)">+</button></div></div>`}).join("")+`<div class="tot"><span>Total</span><span>${fmt(t)}</span></div><button class="act" onclick="cp()">Copiar pedido</button><button class="act s" onclick="closeC()">Continuar escolhendo</button><p class="note">Mostre ou envie este pedido ao garçom.</p>`:`<p class="note">Seu pedido está vazio.</p><button class="act s" onclick="closeC()">Fechar</button>`);
 $("ov").style.display="block"}
function closeC(){$("ov").style.display="none"}
function cp(){const e=Object.entries(cart);let t="Pedido – Pesqueiro Paraíso\n"+e.map(([n,b])=>`${b.q}x ${n} – ${fmt(b.q*b.p)}`).join("\n")+"\nTotal: "+fmt(e.reduce((a,[,b])=>a+b.q*b.p,0));
 try{navigator.clipboard.writeText(t).then(()=>alert("Pedido copiado!"),()=>prompt("Copie o pedido:",t))}catch(x){prompt("Copie o pedido:",t)}}
$("nav").innerHTML=D.map(c=>`<button data-i="${c.id}">${c.t}</button>`).join("");
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(q){q="";$("s").value="";render()}document.getElementById(b.dataset.i).scrollIntoView({behavior:"smooth"})};
$("s").oninput=e=>{q=e.target.value;render()};
addEventListener("scroll",()=>{if(q)return;let cur=D[0].id;D.forEach(c=>{const el=$(c.id);if(el&&el.getBoundingClientRect().top<140)cur=c.id});
 document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.i===cur;b.classList.toggle("on",on);if(on){const n=$("nav");n.scrollLeft=b.offsetLeft-(n.clientWidth-b.offsetWidth)/2}})},{passive:true});
render();
